<html>

<style type="text/css">

*{
 margin: 0px;
 padding: 0px;
}


.area {
    width: 100%;
    height: 100%;
    z-index: 0;
    position: relative;
    display: none;
}

.article{
    border: 1px solid #2980b9;
    position: absolute;
    cursor: move;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5px;
    box-sizing: border-box;
    align-items: center;
    /*--------------------------------*/
    background-position: center;
    background-size: contain;
    background-repeat: no-repeat;
}

/**************/
</style>

<main class="slideshow" id="contenedor">

</main>
<audio id="audio" src="" loop autoplay=""></audio>
<script src="assets/publish_assets/javascript/Socket.IOv3.0.1.js"></script>
<script type="text/javascript">


let socket = io("http://192.168.1.70:3000",{

   withCredentials:true,

});

socket.on("data-publish", (data) => {
  
        Render_data(data)

});


socket.on("Select-Musica", (data) => {

  console.log('la musixa es :',data);

  var audio = document.getElementById('audio');
  audio.src = data;

});


socket.on("Play", (data) => {
  
        audio.play();

});

socket.on("Pause", (data) => {
  
        audio.pause();

});

socket.on("Volumen", (data) => {
  
        audio.volume = data;

});


var slides = document.getElementsByClassName("area");
var currentSlide = 0;


document.addEventListener("mousemove", function(event) {

    audio.play();
    
});

function showSlide(){        
    for (var i = 0; i < slides.length; i++) {       
          slides[i].style.display = "none";
    }

    slides[currentSlide].style.display = "block";
}

function nextSlide(){
    currentSlide++;
    if (currentSlide >= slides.length) {
             currentSlide = 0;
    }
    showSlide();
}

if(document.getElementById("contenedor").childNodes.length>0){

        setInterval(nextSlide,2000);

}

    
/**************************************************************/

/***********************************/

let Contain_areas = document.getElementById("contenedor");

function Render_data(data){

    Contain_areas.innerHTML="";

    data.forEach(function(area,index){
    
        Contain_areas.innerHTML+=`<section class="containnerArea"><div class="area" id="area"></div></section>`;
        document.getElementsByClassName("containnerArea")[index].style.background = area.background;
       /*--------------------------------------*/
        let area_product =  document.getElementsByClassName("area")[index];

        area.product.forEach(function(product,index){

            let area = document.createElement("div");
           /* area.innerHTML=product.width+" | "+product.height;*/
            area.className="article";
            area.style.left = product.left;
            area.style.top = product.top;
            area.style.width = product.width; // Tamaño inicial un poco más grande
            area.style.height = product.height;
            area.style.background = product.background;
            area.style.backgroundSize = 'contain';
            area.style.backgroundPosition = 'center';
            area.style.backgroundRepeat = 'no-repeat';

            area_product.appendChild(area);

            console.log(product.background)

        })
       /*--------------------------------------*/


    });


}






</script>
</html>
