// --- Socket Events ---
socket.on("data-publish", Render_data);
socket.on("Select-Musica", music => {audio.src = music; audio.play();});
socket.on("Play", () =>{audio.play()});
socket.on("Pause", () => audio.pause());
socket.on("Volumen", volume => { audio.volume = volume; });

// --- Render Functions ---//

function Render_data(data){

    console.log(data)
    slidedata = []
    slidedata = data;
    slideshow.innerHTML = ""; // Limpia slides anteriores
    
    slidedata.forEach((slide, i) => {
        
        const div = document.createElement('div');
        div.className = 'slide';
        div.style.background = slide.background || "#222";
        slideshow.appendChild(div);

        // Imagen de fondo
        if (slide.imageURL){

            const img = document.createElement('img');
            img.src =slide.imageURL;
            img.className = "imagen-area";
            div.appendChild(img);
        }
 
        // Video
        if (slide.video){
            
            const video = document.createElement('video');
            video.src = slide.video;
            video.id = `media${i}`;
            video.className="videoplay"
            video.muted = false;
            div.appendChild(video);

        }

        if(slide.sound) {
            const audio = document.createElement('audio');
            audio.src = slide.sound;
            audio.id = `media${i}`;
            div.appendChild(audio);
        }

        /*-------------Productos---------------*/

        (slide.product || []).forEach(product =>{
          
            const article = document.createElement("div");
            article.className = "article";

            Object.assign(article.style,{

                left: product.left,
                top: product.top,
                width: product.width,
                height: product.height,
                background: product.background || "transparent"

            });           

            //Imagen del producto
            if (product.imageURL){

                const img = document.createElement('img');
                img.src = product.imageURL;
                img.className = "imagen-square";
                article.appendChild(img);
            }

            //Texto del producto
            if (product.Text.contenidoHTML!=""){

                RenderTextenDiv(article, product.Text);

            }           

            div.appendChild(article);

        }); 

        /*--------------Productos----------------*/
    });

    index = 0;
    nextSlide();
}

function nextSlide(){

    if (slidedata.length === 0) return;

    /*  
    if (index % 2 === 0) {
        slideshow.classList.remove('vertical');
        slideshow.style.transform = `translateX(-${index * 100}vw)`;
    } 
    else {
        slideshow.classList.add('vertical');
        slideshow.style.transform =`translateY(-${index * 100}vh)`;
    }
    */

    slideshow.style.transform = `translateX(-${index * 100}vw)`;

    playMediaForSlide(index);

    console.log(index+'/ '+slidedata[index].duration)

    const nextTime = slidedata[index].duration; // Valor por defecto
    index = (index + 1) % slidedata.length;

    setTimeout(nextSlide, nextTime);
}

/*------------------------------------------------------*/

function stopAllMedia(){
  
  slidedata.forEach((_, i) => {
    const media = document.getElementById(`media${i}`);
    if (media){
      media.pause();
      media.currentTime = 0;
    }
  });

}

function playMediaForSlide(i) {
 
  stopAllMedia();
  const media = document.getElementById(`media${i}`);
  if (media) media.play();

}

function RenderTextenDiv(divElement,datosObjeto){
    
    let finalHTML = '';

    if (datosObjeto.contenidoHTML){ finalHTML += datosObjeto.contenidoHTML; }

    let textContentDiv = divElement.querySelector('.text-content');
   
    if (!textContentDiv){
        textContentDiv = document.createElement('div');
        textContentDiv.className = 'text-content';
        divElement.appendChild(textContentDiv);
    }
    
    textContentDiv.innerHTML = finalHTML;

    // Flex alignment
    divElement.style.alignItems = datosObjeto.posicionHorizontal || 'flex-start';
    divElement.style.justifyContent = datosObjeto.posicionVertical || 'flex-start';
    
    // Tamaño y posición
    if (datosObjeto.left) divElement.style.left = `${datosObjeto.left}%`;
    if (datosObjeto.top) divElement.style.top = `${datosObjeto.top}%`;
    if (datosObjeto.width) divElement.style.width = `${datosObjeto.width}%`;
    if (datosObjeto.height) divElement.style.height = `${datosObjeto.height}%`;
    
    // Fondo
    if (datosObjeto.backgroundColor) divElement.style.backgroundColor = datosObjeto.backgroundColor;

}
