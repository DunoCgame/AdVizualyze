<script type="text/javascript">

api.receive("data-time-counter",(event,objetoTiempo)=>{

    /*------------------------------------------*/
     let containner = document.getElementById("containnerContador");
     let Contador = document.getElementById("Contador");

  function actualizarContador(){
       
        const tiempoInicial = new Date(objetoTiempo.TiempoInicial).getTime();
        const tiempoFinal = new Date(objetoTiempo.TiempoFinal).getTime();        
        const ahora = new Date().getTime();
        const tiempoRestante = tiempoFinal - ahora;

         // Validar que la hora actual sea posterior al TiempoInicial
        if (ahora < tiempoInicial) {
            Contador.innerHTML = "Esperando inicio...";
            return; // No hacer nada más hasta que el tiempo inicial haya pasado
        }

        if (tiempoRestante<= 0) {
            clearInterval(intervalo);
            Contador.innerHTML = "¡Tiempo terminado!";
            return;
        }

        const dias = Math.floor(tiempoRestante / (1000 * 60 * 60 * 24));
        const horas = Math.floor((tiempoRestante % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((tiempoRestante % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((tiempoRestante % (1000 * 60)) / 1000);

        Contador.innerHTML = `${horas} hr ${minutos} min ${segundos} seg`;
       
    }

   setTimeout(function(){
      actualizarContador();
   },1000) // Actualizar el contador inmediatamente y luego cada segundo
   
   const intervalo = setInterval(actualizarContador, 1000);
    /*------------------------------------------*/
    
  
});
