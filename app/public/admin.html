<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descripción de la página" class="meta-descripcion" id="meta-descripcion">
  <link rel="stylesheet" type="text/css" href="assets/admin_assets/stylesheets/style-estructure.css">
  <link rel="stylesheet" type="text/css" href="assets/admin_assets/stylesheets/style-reproductor.css">
  <link rel="stylesheet" type="text/css" href="assets/admin_assets/stylesheets/style-square.css">
  <link rel="stylesheet" type="text/css" href="assets/admin_assets/stylesheets/style-Timer.css">
  <link rel="stylesheet" type="text/css" href="assets/admin_assets/icono/style.css">
</head>
<style type="text/css">
  
</style>
<title id="version"></title>

<div id="containnerContador">
  <label id="Contador"></label>
</div>

<body class="control-app" id="app">
    <div id="text-editor-panel">
        <h3>Editor de Texto</h3>

        <div class="text-format-buttons">
            <div class="position-controls">
                <span>Posición del Contenido:</span>
                <div>
                    <span>Vertical:</span>
                    <input type="range" id="vertical-align-slider" min="0" max="2" value="0" step="1" title="Alineación Vertical">
                </div>
                <div>
                    <span>Horizontal:</span>
                    <input type="range" id="horizontal-align-slider" min="0" max="2" value="0" step="1" title="Alineación Horizontal">
                </div>
            </div>
            
            <button data-command="undo" title="Deshacer">&#8630;</button>
            <button data-command="redo" title="Rehacer">&#8631;</button>

            <select id="font-family-select" title="Familia de Fuente" data-command="fontName">
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Tahoma, sans-serif">Tahoma</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="Courier New, monospace">Courier New</option>
            </select>

            <select id="font-size-select" title="Tamaño de Fuente" data-command="fontSize">
                <option value="1">Pequeño</option>
                <option value="2">Normal</option>
                <option value="3" selected>Mediano</option>
                <option value="4">Grande</option>
                <option value="5">Extra Grande</option>
            </select>

            <label id="font-color-label" title="Color de Fuente">
                Color:
                <input type="color" id="font-color-input" value="#000000" data-command="foreColor">
            </label>
            
            <button data-command="justifyLeft" title="Alinear Izquierda"><span>&#8592;</span></button>
            <button data-command="justifyCenter" title="Alinear Centro"><span>&#8863;</span></button>
            <button data-command="justifyRight" title="Alinear Derecha"><span>&#8594;</span></button>
            <button data-command="justifyFull" title="Justificar"><span>&#8801;</span></button>
            
            <button data-command="bold" title="Negrita"><b>B</b></button>
            <button data-command="italic" title="Cursiva"><i>I</i></button>
            <button data-command="underline" title="Subrayado"><u>U</u></button>
            <button data-command="createLink" title="Insertar Enlace">&#128279;</button>
            <button data-command="removeFormat" title="Limpiar Formato">T&#x2338;</button>
            <button data-command="insertUnorderedList" title="Lista No Ordenada">Lista (•)</button>
            <button data-command="insertOrderedList" title="Lista Ordenada">Lista (1.)</button>
            <button data-command="formatBlock" data-value="h4" title="Encabezado">H4</button>
        </div>
        <div id="text-editor-area" contenteditable="true" placeholder="Escribe tu texto aquí..."></div>
        <button id="save-text-btn">Guardar Texto</button>
        <button id="close-text-editor" style="background-color: #f44336; color: white;">Cerrar</button>
    </div>
      <div class="Containner-area" id="container_area">          
      </div>  
      <div class="Control-imagen">
        <select id="SectionControl_Select_Section" onchange="Selectror_de_areas()">
              <option value="null">Selecionar Area</option>
        </select>
         <button id="SectionControl_btn_Add_section" class="btnEfect" onclick="Adding_area()">+</button>
          <div id="containner-servidor">
            Servidor:<span id="servidor"></span>
          </div>
      </div>
      <div class="Music">
            <div class="reproductor">
                  <section class="btn-container">
                        <audio id="audio"></audio>
                        <div>
                          <button class="icon-previous2 btn-music Anterior" id="previo" ></button>
                          <button id="play-pause" class="icon-play3 btn-music play_pause"></button>
                          <button class="icon-next2 btn-music Siguiente"  id="siguiente" ></button>
                        </div>  
                        <div>
                          <button class="icon-music btn-music select-music" id="select-music" onclick="Search_music()"></button>
                        </div>  
                  </section>
                    <!----------------->
                  <section class="volumen-containner">
                      <div>
                      <span>Audio Interno</span>
                     </div>
                      <div>
                       <span class="icon-volume-decrease"></span>  
                       <input type="range" class="volumen" id="volumen" min="0" max="1" step="0.1" value="1">
                       <span class="icon-volume-increase"></span>
                     <div>
                  </section>   

                   <section class="volumen-containner-ext">
                      <div>
                        <span>Audio Externo</span>
                      </div>
                      <div>
                         <span class="icon-volume-decrease"></span>   
                         <input type="range" class="volumen_externo" id="volumen_externo" min="0" max="1" step="0.1" value="1">
                         <span class="icon-volume-increase"></span>
                      </div>
                  </section>
                        <!----------------->
                  <section class="containner-progres-bar">
                      <section class="base-progres-bar">
                           <div id="progress-bar-line">
                                 <input type="range" id="progresoBarra" value="0" min="0" max="100">
                           </div>
                      </section>
            <div id="tiempo" style="color:white">
                <span id="tiempoActual">0:00</span> / <span id="duracionTotal">0:00</span>
            </div>
                    </section>

                  </section>
                        <!----------------->
                  <section class="containner-musica">
                    <select class="select-musica" id="name_select_music" onchange="Select_music_option()">
                    </select>
                  </section>
            </div>
      </div>
</body>

<script type="text/javascript" src="assets/admin_assets/icono/selection.json"></script>

<script type="text/javascript" src="assets/admin_assets/javascript/Funciones_area.js"></script>
<script type="text/javascript" src="assets/admin_assets/javascript/Funciones_square.js"></script>
<script type="text/javascript" src="assets/admin_assets/javascript/music_control.js"></script>
<script type="text/javascript" src="assets/admin_assets/javascript/AudioSpeak.js"></script>

</html>
